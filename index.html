<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MOKO Expenses</title>

<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<style>
body{
    font-family:Tahoma;
    background:#f5f7fb;
    margin:0;
}
header{
    background:#0f172a;
    color:white;
    padding:15px;
    text-align:center;
}
.container{
    max-width:900px;
    margin:auto;
    padding:20px;
}
.card{
    background:white;
    padding:15px;
    margin-bottom:15px;
    border-radius:10px;
}
input,textarea{
    width:100%;
    padding:10px;
    margin-top:5px;
}
button{
    background:#2563eb;
    color:white;
    border:none;
    padding:10px 20px;
    cursor:pointer;
}
table{
    width:100%;
    border-collapse:collapse;
}
td,th{
    border:1px solid #ddd;
    padding:8px;
}
</style>
</head>
<body>

<header>
    <h2>نظام إدارة المصروفات MOKO</h2>
</header>

<div class="container">

<div class="card">
    <button onclick="loginFacebook()">تسجيل الدخول بفيسبوك</button>
    <h3 id="username">غير مسجل</h3>
</div>

<div class="card">
    <h3>إضافة مصروف</h3>

    <input type="number" id="amount" placeholder="المبلغ">

    <textarea id="reason" placeholder="سبب الصرف"></textarea>

    <button onclick="saveExpense()">حفظ</button>
</div>

<div class="card">
    <h3>الإحصائيات</h3>

    <p>اليوم: <span id="daily">0</span></p>
    <p>الأسبوع: <span id="weekly">0</span></p>
    <p>الشهر: <span id="monthly">0</span></p>
</div>

<div class="card">
    <button onclick="exportExcel()">تصدير Excel</button>
</div>

<div class="card">
    <table>
        <thead>
            <tr>
                <th>التاريخ</th>
                <th>المستخدم</th>
                <th>السبب</th>
                <th>المبلغ</th>
            </tr>
        </thead>
        <tbody id="expensesTable"></tbody>
    </table>
</div>

</div>

<script type="module" src="app.js"></script>

</body>
</html>
