<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M.NAJM | Live Core Bot Engine</title>
    <style>
        :root {
            --neon-blue: #00D1FF;
            --neon-purple: #6C2BFF;
            --bg: #0B0B0F;
            --glass: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.08);
            --success: #00E676;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: var(--bg); color: #ffffff; padding: 30px 15px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .super-panel { background: var(--glass); border: 1px solid var(--border); backdrop-filter: blur(25px); border-radius: 24px; padding: 35px; width: 100%; max-width: 600px; box-shadow: 0 25px 50px rgba(0,0,0,0.6); }
        .header { text-align: center; margin-bottom: 25px; border-bottom: 1px solid var(--border); padding-bottom: 20px; }
        .header h1 { font-size: 24px; font-weight: 800; background: linear-gradient(135deg, var(--neon-blue), var(--neon-purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        .status-bar { display: inline-flex; align-items: center; gap: 10px; padding: 8px 20px; border-radius: 30px; font-size: 13px; font-weight: bold; background: rgba(0, 0, 0, 0.4); border: 1px solid var(--border); }
        .dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; background: #aaa; }
        .active-dot { background: var(--success); box-shadow: 0 0 12px var(--success); }
        
        .section-title { font-size: 15px; color: var(--neon-blue); margin: 25px 0 15px 0; font-weight: 700; border-right: 3px solid var(--neon-purple); padding-right: 8px; }
        input, textarea { width: 100%; background: #111116; border: 1px solid var(--border); color: #fff; padding: 12px 16px; border-radius: 12px; outline: none; font-size: 14px; margin-bottom: 15px; }
        
        .btn-main { background: linear-gradient(135deg, var(--neon-purple), #531bdf); color: #ffffff; border: none; padding: 15px; border-radius: 12px; font-size: 16px; font-weight: bold; cursor: pointer; width: 100%; box-shadow: 0 5px 20px rgba(108, 43, 255, 0.4); }
        .console-box { background: #050508; border: 1px solid var(--border); padding: 15px; border-radius: 12px; font-family: monospace; font-size: 12px; color: var(--success); max-height: 150px; overflow-y: auto; text-align: left; direction: ltr; }
    </style>
</head>
<body>

    <div class="super-panel">
        <div class="header">
            <h1>المحرك الشجري الحي للبوت ⚙️</h1>
            <div class="status-bar">
                <span class="dot" id="engine-dot"></span>
                <span id="engine-text">المحرك متوقف (اضغط تشغيل)</span>
            </div>
        </div>

        <div class="section-title">🔑 بيانات الربط النشطة</div>
        <input type="text" id="tg-token" value="8338334656:AAFJosPcNri8hJeERp7Si-JXzSkxmBAmwG8">
        <input type="password" id="openai-key" value="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">

        <div class="section-title">📝 رسالة الترحيب الافتراضية عند (/start)</div>
        <textarea id="welcome-msg" rows="3">أهلاً بك في بوت النجم الذكي لخدمات البرمجة والأتمتة! 🚀 

الرجاء اختيار أحد الأقسام من القائمة بالأسفل، أو اكتب سؤالك البرمجي مباشرة ليجيبك الذكاء الاصطناعي ChatGPT فوراً!</textarea>

        <button class="btn-main" onclick="startBotEngine()">تشغيل المحرك وبدء الرد الشجري فوراً 🚀</button>

        <div class="section-title">💻 سجل العمليات المباشر (Live Console)</div>
        <div class="console-box" id="console-out">في انتظار تشغيل المحرك لبدء الاستماع لرسائل تليجرام...</div>
    </div>

    <script>
        let lastUpdateId = 0;
        let isRunning = false;

        function log(text) {
            const out = document.getElementById('console-out');
            out.innerHTML += `<br>[${new Date().toLocaleTimeString()}] ${text}`;
            out.scrollTop = out.scrollHeight;
        }

        // شجرة الردود الثابتة بناءً على طلبك (المستوى الأول والثاني)
        const treeResponses = {
            '/start': () => document.getElementById('welcome-msg').value,
            '/python': () => `🐍 **قسم لغة بايثون Python:**\n\nإليك الأدوات المتاحة:\n1. كود سحب بيانات الويب (Scraping)\n2. سكربت أتمتة المهام اليومية\n3. كود بناء بوت تليجرام ذكي\n\nلطلب كود معين، اكتب "كود بايثون" متبوعاً بطلبك.`,
            '/web': () => `🌐 **قسم تطوير الويب Web Development:**\n\nمتاح لدينا أدوات متكاملة:\n1. قوالب HTML/CSS جاهزة ومستجابة\n2. أكواد JavaScript للتفاعل والمؤثرات\n3. ربط قواعد البيانات الفايربيس\n\nاكتب مشكلتك أو طلبك البرمجي هنا وسيتم توليد الكود لك.`,
            '/tools': () => `🛠️ **أدوات وملفات جاهزة للتحميل:**\n\nمتاح حالياً تحميل:\n- ملف مكتبة الأكواد الجاهزة: https://raw.githubusercontent.com/python/cpython/main/Lib/os.py\n- قالب الواجهة المظلمة لملفات الـ HTML.`
        };

        // تشغيل المحرك والاستماع المستمر للرسائل (Polling من المتصفح)
        function startBotEngine() {
            if(isRunning) return;
            isRunning = true;
            
            document.getElementById('engine-dot').classList.add('active-dot');
            document.getElementById('engine-text').innerText = "المحرك يعمل الآن ويستمع للبوت... 🔥";
            log("تم تشغيل المحرك السحابي الذاتي بنجاح.");
            
            // بدء حلقة الاستماع اللانهائية
            pollTelegramMessages();
        }

        async function pollTelegramMessages() {
            const token = document.getElementById('tg-token').value;
            const apiKey = document.getElementById('openai-key').value;
            
            const url = `https://api.telegram.org/bot${token}/getUpdates?offset=${lastUpdateId + 1}&timeout=3`;

            try {
                const res = await fetch(url);
                const data = await res.json();

                if (data.ok && data.result.length > 0) {
                    for (let update of data.result) {
                        lastUpdateId = update.update_id;
                        
                        if (update.message && update.message.text) {
                            const chatId = update.message.chat.id;
                            const userText = update.message.text.trim();
                            
                            log(`مستلم من [${chatId}]: ${userText}`);

                            // 1. الفحص داخل شجرة الردود الثابتة أولاً
                            if (treeResponses[userText]) {
                                const reply = treeResponses[userText]();
                                await sendTgMessage(token, chatId, reply);
                            } 
                            // 2. إذا لم يكن أمراً شجرياً، يتم تحويل السؤال بالكامل لـ ChatGPT
                            else {
                                log("جاري استدعاء ChatGPT للرد...");
                                const aiReply = await askChatGPT(apiKey, userText);
                                await sendTgMessage(token, chatId, aiReply);
                            }
                        }
                    }
                }
            } catch (err) {
                console.error("خطأ أثناء جلب الرسائل:", err);
            }

            // استمرار الاستماع دائمًا طالما الصفحة مفتوحة
            if(isRunning) {
                setTimeout(pollTelegramMessages, 1000);
            }
        }

        // دالة إرسال الرسالة لتليجرام
        async function sendTgMessage(token, chatId, text) {
            const url = `https://api.telegram.org/bot${token}/sendMessage`;
            await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chat_id: chatId, text: text, parse_mode: 'Markdown' })
            });
            log(`تم إرسال الرد إلى العميل بنجاح.`);
        }

        // دالة الاتصال المباشر بـ ChatGPT API
        async function askChatGPT(apiKey, prompt) {
            const url = "https://api.openai.com/v1/chat/completions";
            try {
                const res = await fetch(url, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${apiKey}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        model: "gpt-4o",
                        messages: [{ role: "user", content: prompt }]
                    })
                });
                const data = await res.json();
                return data.choices[0].message.content;
            } catch (e) {
                return "عذراً، واجهت مشكلة في معالجة الرد عبر الذكاء الاصطناعي.";
            }
        }
    </script>
</body>
</html>
