<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M.NAJM | Complete Tree Menu Deployer</title>
    <style>
        :root {
            --neon-blue: #00D1FF;
            --neon-purple: #6C2BFF;
            --bg: #0B0B0F;
            --glass: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.08);
            --success: #00E676;
            --danger: #FF1744;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: var(--bg); color: #ffffff; padding: 30px 15px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .super-panel { background: var(--glass); border: 1px solid var(--border); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px); border-radius: 24px; padding: 35px; width: 100%; max-width: 600px; box-shadow: 0 25px 50px rgba(0,0,0,0.6); }
        .header { text-align: center; margin-bottom: 30px; border-bottom: 1px solid var(--border); padding-bottom: 20px; }
        .header h1 { font-size: 24px; font-weight: 800; background: linear-gradient(135deg, var(--neon-blue), var(--neon-purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        .status-bar { display: inline-flex; align-items: center; gap: 10px; padding: 8px 20px; border-radius: 30px; font-size: 13px; font-weight: bold; margin-top: 15px; background: rgba(0, 0, 0, 0.4); border: 1px solid var(--border); }
        .dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
        .online { color: var(--success); border-color: rgba(0, 230, 118, 0.3); }
        .online .dot { background: var(--success); box-shadow: 0 0 12px var(--success); }
        
        .section-title { font-size: 15px; color: var(--neon-blue); margin: 25px 0 15px 0; font-weight: 700; border-right: 3px solid var(--neon-purple); padding-right: 8px; }
        .form-group { margin-bottom: 18px; text-align: right; }
        label { display: block; font-size: 13px; color: #C8C8D0; margin-bottom: 8px; }
        input, textarea { width: 100%; background: #111116; border: 1px solid var(--border); color: #fff; padding: 12px 16px; border-radius: 12px; outline: none; font-size: 14px; }
        input:focus { border-color: var(--neon-blue); }
        
        .btn-main { background: linear-gradient(135deg, var(--neon-purple), #531bdf); color: #ffffff; border: none; padding: 15px; border-radius: 12px; font-size: 16px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 20px; box-shadow: 0 5px 20px rgba(108, 43, 255, 0.4); }
        .btn-main:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(108, 43, 255, 0.6); }
        
        .log-box { background: #050508; border: 1px solid var(--border); padding: 15px; border-radius: 12px; font-family: monospace; font-size: 12px; color: var(--success); margin-top: 15px; max-height: 150px; overflow-y: auto; text-align: left; direction: ltr; }
    </style>
</head>
<body>

    <div class="super-panel">
        <div class="header">
            <h1>محرك حقن الشجرة التفاعلية المباشر 🚀</h1>
            <div class="status-bar online">
                <span class="dot"></span>
                <span>متصل وجاهز للحقن الفوري في سيرفرات تليجرام</span>
            </div>
        </div>

        <div class="section-title">🔑 بيانات الربط المدمجة</div>
        <div class="form-group">
            <label>توكن البوت الخاص بك:</label>
            <input type="text" id="bot-token" value="8338334656:AAFJosPcNri8hJeERp7Si-JXzSkxmBAmwG8">
        </div>
        <div class="form-group">
            <label>مفتاح OpenAI API (ChatGPT):</label>
            <input type="password" id="openai-key" value="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">
        </div>

        <div class="section-title">💬 محتوى رسالة الترحيب والشجرة</div>
        <div class="form-group">
            <label>نص رسالة الترحيب الشجرية الأساسية:</label>
            <textarea id="welcome-text" rows="3">مرحباً بك في أداة النجم البرمجية الشاملة لمعرفة المعلومات وكتابة الأكواد! 🧠💻

الرجاء اختيار أحد الأقسام البرمجية التالية من الأزرار التفاعلية بالأسفل للبدء فوراً:</textarea>
        </div>

        <button class="btn-main" onclick="deployTreeEngine()">تفعيل وحقن الشجرة التفاعلية في البوت فوراً ⚡</button>

        <div class="section-title">📡 سجل عمليات الحقن (Live Terminal)</div>
        <div class="log-box" id="log-output">في انتظار ضغط زر التفعيل للبدء...</div>
    </div>

    <script>
        function printLog(msg) {
            const el = document.getElementById('log-output');
            el.innerHTML += `<br>[${new Date().toLocaleTimeString()}] ${msg}`;
            el.scrollTop = el.scrollHeight;
        }

        // الدالة الأساسية الكبرى اللي بتتحكم وتصنع الشجرة التفاعلية والردود اللحظية
        async function deployTreeEngine() {
            const token = document.getElementById('bot-token').value;
            const apiKey = document.getElementById('openai-key').value;
            const welcomeMsg = document.getElementById('welcome-text').value;

            if(!token || !apiKey) {
                alert("يرجى التأكد من وجود التوكن ومفتاح الـ API.");
                return;
            }

            printLog("بدء عملية فحص وتهيئة البوت البرمجي...");

            // 1. أولاً: تنظيف أي إعدادات قديمة أو معلقة في تليجرام
            try {
                printLog("جاري تنظيف قنوات الاتصال القديمة...");
                await fetch(`https://api.telegram.org/bot${token}/deleteWebhook`);
                printLog("تم تنظيف قنوات الاتصال بنجاح.");
            } catch (e) {
                printLog("تنبيه أثناء التنظيف: " + e.message);
            }

            // 2. ثانياً: تشغيل حلقة الاستماع المباشر والرد الشجري الذاتي (Live Polling Engine)
            // المتصفح نفسه هيفضل صاحي ويقرا رسائل البوت ويرد عليها بالشجرة الكاملة والأزرار فوراً
            printLog("جاري تشغيل محرك الاستماع الذاتي للرسائل...");
            listenAndReplyLoop(token, apiKey, welcomeMsg);
        }

        let lastUpdateId = 0;

        async function listenAndReplyLoop(token, apiKey, welcomeMsg) {
            printLog("المحرك يعمل الآن بنجاح ومستعد لاستقبال رسائل العملاء... 🔥");
            
            async function poll() {
                const url = `https://api.telegram.org/bot${token}/getUpdates?offset=${lastUpdateId + 1}&timeout=5`;
                try {
                    const res = await fetch(url);
                    const data = await res.json();

                    if (data.ok && data.result.length > 0) {
                        for (let update of data.result) {
                            lastUpdateId = update.update_id;

                            // أ- معالجة النصوص العادية (مثل عمل /start)
                            if (update.message && update.message.text) {
                                const chatId = update.message.chat.id;
                                const text = update.message.text.trim();
                                printLog(`مستلم رسالة من العميل: ${text}`);

                                if (text === '/start') {
                                    // إرسال رسالة الترحيب ومرفق معها الأزرار الأربعة التفاعلية بالشكل الشجري الصواب
                                    await sendTreeButtons(token, chatId, welcomeMsg);
                                } else {
                                    // إذا سأل سؤال عادي، نبعته فوراً لـ ChatGPT ويرد عليه بالكود الكامل
                                    printLog("العميل يطلب كود برمجى.. جاري استدعاء ChatGPT...");
                                    const aiResponse = await callChatGPT(apiKey, text);
                                    await sendTextMessage(token, chatId, aiResponse);
                                }
                            }

                            // ب- معالجة الضغط على الأزرار التفاعلية (Callback Queries) بالشكل الشجري
                            if (update.callback_query) {
                                const callbackId = update.callback_query.id;
                                const chatId = update.callback_query.message.chat.id;
                                const buttonData = update.callback_query.data;
                                printLog(`العميل ضغط على زر تفاعلي: ${buttonData}`);

                                // الإجابة على تليجرام لإغلاق علامة التحميل على الزر
                                await fetch(`https://api.telegram.org/bot${token}/answerCallbackQuery?callback_query_id=${callbackId}`);

                                // تفريع الشجرة بناءً على كليك العميل
                                if (buttonData === 'btn_python') {
                                    const pyReply = "🐍 **قسم لغات البرمجة وأدوات بايثون Python:**\n\nإليك الأدوات الجاهزة والمفاتيح المتاحة:\n1. كود بناء سكريبتات الأتمتة والسيرفرات.\n2. مكتبات الذكاء الاصطناعي وتحليل البيانات.\n\n📥 لتحميل ملف برمجى جاهز بالكامل لإدارة الملفات في بايثون، اضغط على الرابط التالي:\nhttps://raw.githubusercontent.com/python/cpython/main/Lib/os.py";
                                    await sendTextMessage(token, chatId, pyReply);
                                } else if (buttonData === 'btn_web') {
                                    const webReply = "🌐 **قسم تصميم وتطوير مواقع الويب:**\n\nإليك الأدوات الشجرية المتوفرة:\n- قوالب HTML/CSS كاملة وجاهزة للرفع.\n- أكواد جافا سكريبت تفاعلية كاملة للمتصفحات.\n- ربط قواعد بيانات Firebase الذكية الحية.";
                                    await sendTextMessage(token, chatId, webReply);
                                } else if (buttonData === 'btn_files') {
                                    const filesReply = "📁 **قسم الملفات الجاهزة والأدوات:**\n\nتم تجهيز السلسلة الشجرية للملفات:\n- يمكنك كتابة اسم أي لغة برمجية (مثال: 'اكتب كود بايثون للويب') وسيقوم البوت بتوليد الملف البرمجي الصافي لك فوراً بفضل ذكاء ChatGPT.";
                                    await sendTextMessage(token, chatId, filesReply);
                                } else if (buttonData === 'btn_ai') {
                                    const aiIntro = "🧠 **قسم الذكاء الاصطناعي المباشر:**\n\nاكتب سؤالك البرمجي أو مشكلتك في الكود الآن مباشرة في الشات، وسيتولى محرك ChatGPT المطور حلها وكتابة الأكواد الصافية لك بنسبة 100%.";
                                    await sendTextMessage(token, chatId, aiIntro);
                                }
                            }
                        }
                    }
                } catch (e) {
                    console.error("Error in polling loop:", e);
                }
                // استمرار عمل المحرك دون توقف طالما الصفحة مفتوحة
                setTimeout(poll, 1000);
            }
            poll();
        }

        // دالة إرسال الرسالة النصية العادية
        async function sendTextMessage(token, chatId, text) {
            await fetch(`https://api.telegram.org/bot${token}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chat_id: chatId, text: text, parse_mode: 'Markdown' })
            });
            printLog("تم إرسال الرد والشرح البرمجي بنجاح 100%.");
        }

        // دالة إرسال الأزرار التفاعلية الشجرية (Inline Keyboard) تحت رسالة الترحيب مباشرة
        async function sendTreeButtons(token, chatId, text) {
            const payload = {
                chat_id: chatId,
                text: text,
                reply_markup: {
                    inline_keyboard: [
                        [
                            { text: "🐍 أدوات لغة بايثون Python", callback_data: "btn_python" },
                            { text: "🌐 تطوير وتصميم الويب", callback_data: "btn_web" }
                        ],
                        [
                            { text: "📁 ملفات وأكواد جاهزة", callback_data: "btn_files" },
                            { text: "🧠 اسأل ذكاء ChatGPT", callback_data: "btn_ai" }
                        ]
                    ]
                }
            };

            await fetch(`https://api.telegram.org/bot${token}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            printLog("تم إرسال شجرة الأزرار التفاعلية الأربعة للمستخدم بنجاح!");
        }

        // دالة الاتصال المباشر بمحرك ChatGPT بالمفتاح المدمج لردود الذكاء الاصطناعي
        async function callChatGPT(apiKey, userPrompt) {
            try {
                const response = await fetch("https://api.openai.com/v1/chat/completions", {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${apiKey}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        model: "gpt-4o",
                        messages: [{ role: "user", content: userPrompt }]
                    })
                });
                const resData = await response.json();
                return resData.choices[0].message.content;
            } catch (err) {
                return "عذراً، واجهت مشكلة في الاتصال بمحرك OpenAI. تأكد من شحن حساب الـ API الخاص بك.";
            }
        }
    </script>
</body>
</html>
