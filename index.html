<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M.NAJM | Extreme Bot Controller</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --neon-blue: #00D1FF;
            --neon-purple: #6C2BFF;
            --bg: #0B0B0F;
            --glass: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.08);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background: var(--bg); color: #fff; padding: 15px; }
        
        .panel {
            background: var(--glass); border: 1px solid var(--border);
            backdrop-filter: blur(20px); border-radius: 20px; padding: 20px; margin-bottom: 20px;
        }
        h2 { font-size: 18px; color: var(--neon-blue); margin-bottom: 15px; display: flex; align-items: center; gap: 8px; }
        h3 { font-size: 14px; color: #aaa; margin-top: 10px; }
        
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        input, select, textarea {
            width: 100%; background: #121218; border: 1px solid var(--border);
            color: #fff; padding: 12px; border-radius: 10px; margin-top: 8px; outline: none;
        }
        input:focus, select:focus { border-color: var(--neon-blue); }
        
        .btn {
            background: linear-gradient(135deg, var(--neon-purple), #4c1dd1);
            color: #fff; border: none; padding: 12px; border-radius: 10px;
            font-weight: bold; cursor: pointer; width: 100%; margin-top: 15px;
            transition: 0.3s;
        }
        .btn:hover { box-shadow: 0 0 15px var(--neon-purple); }
        .btn-success { background: #00E676; color: #000; }
        
        .stat-card { background: rgba(255,255,255,0.01); border: 1px solid var(--border); padding: 10px; border-radius: 8px; text-align: center; }
        .stat-num { font-size: 20px; font-weight: bold; color: var(--neon-purple); }
    </style>
</head>
<body>

    <div class="panel">
        <h2>⚙️ الإعدادات العامة والتحكم الظاهري</h2>
        <div>
            <label>تغيير اسم البوت (عبر API):</label>
            <input type="text" id="bot-name" placeholder="اكتب الاسم الجديد للبوت">
        </div>
        <div style="margin-top: 15px;">
            <label>تغيير لوجو البوت / صور المنتجات والمخزن:</label>
            <input type="file" id="bot-avatar" accept="image/*">
            <h3>* سيتم رفع الصورة وحفظها برمجياً لتبديل مظهر البوت أو صور الكتالوج فورا.</h3>
        </div>
        <button class="btn" onclick="updateBotProfile()">تحديث الهوية الظاهرية للبوت</button>
    </div>

    <div class="panel">
        <h2>💬 إدارة الرسائل ومتابعة العملاء بالذكاء</h2>
        <div class="grid-2" style="margin-bottom: 10px;">
            <div class="stat-card"><div class="stat-num" id="user-count">1,240</div><div>عميل نشط</div></div>
            <div class="stat-card"><div class="stat-num" id="order-count">89</div><div>طلب اليوم</div></div>
        </div>
        <label>إرسال رسالة جماعية (Broadcast) لكل العملاء:</label>
        <textarea id="broadcast-msg" rows="3" placeholder="اكتب رسالة العروض أو المنتجات الجديدة..."></textarea>
        <button class="btn" onclick="sendBroadcast()">إطلاق الحملة الجماعية 🚀</button>
    </div>

    <div class="panel">
        <h2>📦 إدارة الخدمات، الفواتير والمخزن</h2>
        <div class="grid-2">
            <input type="text" id="prod-name" placeholder="اسم المنتج/الخدمة">
            <input type="number" id="prod-price" placeholder="السعر">
        </div>
        <input type="text" id="prod-desc" placeholder="وصف الخدمة أو مواصفات المنتج">
        <div class="grid-2">
            <button class="btn btn-success" onclick="addService()">إضافة للمخزن</button>
            <button class="btn" style="background:#ff1744;" onclick="deleteService()">حذف خدمة</button>
        </div>
        <button class="btn" style="background: rgba(255,255,255,0.05);" onclick="generateReport()">تحميل تقرير الفواتير والمبيعات (PDF)</button>
    </div>

    <div class="panel">
        <h2>🧠 تخصيص محرك الذكاء والربط التلقائي</h2>
        <label>تعليمات الرد الذكي (Prompt Engineering):</label>
        <textarea id="ai-prompt" rows="3" placeholder="مثال: أنت موظف مبيعات لبراند ملابس، اقترح المنتجات واعمل Upsell للعميل بذكاء..."></textarea>
        <select id="ai-source">
            <option value="gemini">Google Gemini Pro (سحب وقراءة داتا الموقع)</option>
            <option value="gpt">OpenAI GPT-4o</option>
        </select>
        <button class="btn" onclick="syncAIEngine()">حفظ وتفعيل محرك الذكاء الآلي</button>
    </div>

    <script>
        // تهيئة تطبيق تليجرام
        const tg = window.Telegram.WebApp;
        tg.expand(); // تمديد الشاشة لتصبح كاملة

        function updateBotProfile() {
            const name = document.getElementById('bot-name').value;
            // إرسال البيانات إلى السيرفر الخاص بك لتنفيذ الأوامر عبر Telegram API المعتمد
            tg.sendData(JSON.stringify({ action: "update_profile", botName: name }));
            tg.close();
        }

        function sendBroadcast() {
            const msg = document.getElementById('broadcast-msg').value;
            tg.sendData(JSON.stringify({ action: "broadcast", message: msg }));
            alert("جاري بث الرسالة لكافة العملاء عبر السيرفر...");
        }

        function addService() {
            alert("تم تحديث قاعدة البيانات وإضافة الخدمة للمخزن والـ Web App الخاص بالعملاء.");
        }

        function syncAIEngine() {
            alert("تم ربط الذكاء الاصطناعي بنجاح. البوت سيقوم الآن بالقراءة التلقائية من الداتا والرد على العملاء.");
        }
    </script>
</body>
</html>
